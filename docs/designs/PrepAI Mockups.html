<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PrepAI — Mockups</title>
<style>
  html, body { margin: 0; padding: 0; background: #F1F5F9; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="theme.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/setlogger.jsx"></script>
<script type="text/babel" src="screens/food.jsx"></script>
<script type="text/babel" src="screens/checkin.jsx"></script>
<script type="text/babel" src="screens/compare.jsx"></script>
<script type="text/babel" src="screens/signin.jsx"></script>
<script type="text/babel" src="screens/workouts.jsx"></script>
<script type="text/babel" src="screens/suggestions.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard, IOSDevice } = window;
const T = window.PrepAITheme;

// Bottom tab bar (used by tabbed screens)
function TabBar({ active = 'home', accent }) {
  const blue = accent || T.colors.brand[500];
  const tabs = [
    { id: 'home', icon: 'home', label: 'Home' },
    { id: 'workouts', icon: 'dumbbell', label: 'Workouts' },
    { id: 'food', icon: 'utensils', label: 'Food' },
    { id: 'progress', icon: 'trending', label: 'Progress' },
    { id: 'comp', icon: 'trophy', label: 'Compete' },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: 80, paddingBottom: 28, paddingTop: 8,
      background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(20px)',
      borderTop: `0.5px solid ${T.colors.neutral[200]}`,
      display: 'flex', justifyContent: 'space-around', alignItems: 'center',
      zIndex: 5,
    }}>
      {tabs.map((t) => {
        const a = active === t.id;
        return (
          <button key={t.id} style={{
            background: 'transparent', border: 'none', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
            padding: '4px 8px',
          }}>
            <Icon name={t.icon} size={22} color={a ? blue : T.colors.neutral[400]} strokeWidth={a ? 2.4 : 2}/>
            <span style={{
              fontSize: 10, fontWeight: a ? 700 : 500, letterSpacing: '0.02em',
              color: a ? blue : T.colors.neutral[400], fontFamily: T.font,
            }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function Frame({ children, tabBar, tabActive, accent, withBottomBar = true }) {
  return (
    <IOSDevice width={390} height={844}>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 56 }}>
        <div style={{ height: '100%', overflow: 'hidden', position: 'relative' }}>
          {children}
          {withBottomBar && tabBar && <TabBar active={tabActive} accent={accent}/>}
        </div>
      </div>
    </IOSDevice>
  );
}

function App() {
  const [tweaks, setTweaks] = window.useTweaks ? window.useTweaks(/*EDITMODE-BEGIN*/{
    "brandHue": "#3B82F6",
    "density": "comfortable",
    "shadowStyle": "soft"
  }/*EDITMODE-END*/) : [{ brandHue: '#3B82F6' }, () => {}];
  const setTweak = setTweaks;
  const accent = tweaks.brandHue;

  // Wrap all screens with current tweaks
  const sharedTweaks = { brandHue: accent };

  return (
    <>
      <DesignCanvas
        title="PrepAI"
        subtitle="Hi-fi mockups · light blue + slate · iOS-first"
        background={T.colors.neutral[100]}
      >
        <DCSection id="primary" title="Daily surfaces" subtitle="The screens used most days — Home, Set Logger, Food">
          <DCArtboard id="home" label="Home · Today" width={390} height={844}>
            <Frame tabBar tabActive="home" accent={accent}>
              <window.HomeScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
          <DCArtboard id="setlog" label="Set Logger · in-gym" width={390} height={844}>
            <Frame withBottomBar={false}>
              <window.SetLoggerScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
          <DCArtboard id="food" label="Food · Today" width={390} height={844}>
            <Frame tabBar tabActive="food" accent={accent}>
              <window.FoodScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="plan" title="This week's plan" subtitle="Workouts laid out across the week — see what's done, what's next, and how the AI is shaping it">
          <DCArtboard id="workouts" label="Workouts · this week" width={390} height={844}>
            <Frame tabBar tabActive="workouts" accent={accent}>
              <window.WorkoutsWeekScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="weekly" title="Weekly rituals" subtitle="Sunday check-in → AI-generated compare → review proposed plan changes">
          <DCArtboard id="checkin" label="Check-in · Photos step" width={390} height={844}>
            <Frame withBottomBar={false}>
              <window.CheckInScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
          <DCArtboard id="compare" label="Compare · streaming" width={390} height={844}>
            <Frame withBottomBar={false}>
              <window.ComparePhotosScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
          <DCArtboard id="suggestions" label="AI suggestions · review" width={390} height={844}>
            <Frame withBottomBar={false}>
              <window.AISuggestionsScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="entry" title="First impressions" subtitle="Sign-in / welcome">
          <DCArtboard id="signin" label="Sign-in" width={390} height={844}>
            <Frame withBottomBar={false}>
              <window.SignInScreen tweaks={sharedTweaks}/>
            </Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Brand"/>
          <window.TweakColor label="Brand blue" value={tweaks.brandHue} onChange={(v) => setTweak('brandHue', v)}/>
          <window.TweakRadio label="Hue preset" value={tweaks.brandHue}
            options={[
              { value: '#3B82F6', label: 'Default' },
              { value: '#0EA5E9', label: 'Sky' },
              { value: '#1D4ED8', label: 'Deep' },
              { value: '#6366F1', label: 'Indigo' },
            ]}
            onChange={(v) => setTweak('brandHue', v)}/>
        </window.TweaksPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
